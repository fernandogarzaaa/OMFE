name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ofm
          POSTGRES_PASSWORD: ofm
          POSTGRES_DB: ofm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ofm -d ofm_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://ofm:ofm@127.0.0.1:5432/ofm_test' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.lock
      - name: Install (hash-pinned)
        run: |
          python -m pip install --require-hashes -r requirements/build.lock
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff
        run: |
          ruff check src tests quality
          ruff format --check src tests quality
      - name: Mypy
        run: mypy src
      - name: Pytest (+ branch coverage)
        run: pytest --cov=ofm_engine --cov-branch --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=90
      - name: Hardened test gate (quality/gate.py)
        if: matrix.db == 'sqlite'
        run: python quality/gate.py --manifest quality/test-manifest.json
      - name: Smoke (mock mode)
        if: matrix.db == 'sqlite'
        env:
          PYTHON: python
          OFM: ofm
        run: scripts/smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.db == 'postgres'
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: npm audit (runtime deps)
        run: npm audit --omit=dev --audit-level=moderate

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans the full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install audit tools (hash-pinned dev lock)
        run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: pip-audit (runtime + dev locks)
        run: |
          pip-audit -r requirements/runtime.lock --require-hashes --disable-pip --progress-spinner off
          pip-audit -r requirements/dev.lock --require-hashes --disable-pip --progress-spinner off
      - name: Bandit (medium+)
        run: bandit -q -r src -ll
      - name: Gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner --exit-code 1

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: omfe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke the image (non-root, healthcheck, SPA + API end-to-end)
        run: |
          test "$(docker run --rm --entrypoint id omfe:ci -u)" = "10001"
          docker run --rm omfe:ci version
          docker run -d --name ofm -p 8000:8000 \
            -e ENV=development -e SEED_DEMO=true -e SEED_DEMO_ARGS=--known-passwords \
            -e RUN_WORKER_IN_PROCESS=true -e RATE_LIMIT_AUTH_PER_MIN=100 omfe:ci
          for i in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' ofm); [ "$s" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' ofm | grep -q healthy || { docker logs ofm; exit 1; }
          BASE=http://127.0.0.1:8000 scripts/e2e_ui.sh || { docker logs ofm; exit 1; }
          # production mode must refuse dev secrets
          ! docker run --rm -e ENV=production omfe:ci serve 2>/dev/null
