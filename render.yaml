# Render Blueprint — free tier (https://render.com/docs/blueprint-spec)
# * Free web services have no background workers, so the job worker runs inside the web
#   process (RUN_WORKER_IN_PROCESS=true). Free instances spin down after ~15 min idle; queued jobs
#   resume on the next request (the outbox is durable in Postgres).
# * Free Postgres EXPIRES 30 days after creation (then a 14-day grace period before deletion).
#   Export with `pg_dump` and upgrade or recreate before then — see docs/deploy.md.
# * MASTER_KEYS must be a Fernet key: generate locally with `ofm gen-key` (or
#   `docker run --rm ghcr.io/fernandogarzaaa/omfe gen-key`) and paste it in the dashboard.
services:
  - type: web
    name: ofm-engine
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ofm-db
          property: connectionString
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: FORWARDED_ALLOW_IPS   # Render's load balancer sets X-Forwarded-For / -Proto
        value: "*"
      - key: PUBLIC_BASE_URL       # e.g. https://ofm-engine.onrender.com or your custom domain
        sync: false
      - key: MASTER_KEYS           # `ofm gen-key`; rotate by prepending a new key, then `ofm rotate-keys`
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PII_HASH_SALT         # never change after go-live: it keys every stored PII hash
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: LOG_JSON
        value: "true"
      # Optional, mock mode until set (or configure per tenant in Settings > Integrations):
      - key: OUTBOUND_WEBHOOKS_LIVE
        value: "false"
      - key: LLM_PROVIDER
        value: mock

databases:
  - name: ofm-db
    plan: free
    databaseName: ofm
    user: ofm
    ipAllowList: []   # only reachable from Render services
