[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ofm-engine"
version = "1.0.0"
description = "OFM Engine — all-in-one growth, tracking and automation toolkit for OnlyFans management agencies (recruitment funnel, GHL CRM sync, Meta CAPI, attribution, revenue KPIs)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Fernando Garza", email = "fernandogarzaaa@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0.30,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic[email]>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "typer>=0.12,<1.0",
  "httpx>=0.27,<1.0",
  "jinja2>=3.1.4,<4.0",
  "pyyaml>=6.0.1,<7.0",
  "python-multipart>=0.0.18",
  "cryptography>=43",
  "python-dotenv>=1.0,<2.0",
  "argon2-cffi>=23.1",
  "pyotp>=2.9,<3.0",
  "pyjwt>=2.9,<3.0",
  "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4.0"]
redis = ["redis>=5.0,<7.0"]
otel = [
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
ofm = "ofm_engine.cli:app"

[project.urls]
Homepage = "https://github.com/fernandogarzaaa/ofm-engine"

[tool.hatch.build.targets.wheel]
packages = ["src/ofm_engine"]

[tool.hatch.build.targets.wheel.force-include]
"src/ofm_engine/web/dist" = "ofm_engine/web/dist"

[tool.hatch.build.targets.sdist]
include = ["src/ofm_engine", "alembic", "alembic.ini", "clients", "sequences", "integrations", "README.md", "LICENSE", "CHANGELOG.md"]
exclude = ["src/ofm_engine/web/dist/.gitkeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:passlib.*", "ignore:Using `httpx` with"]

[tool.coverage.run]
source = ["ofm_engine"]
branch = true
omit = ["src/ofm_engine/otel.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["ofm_engine"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "frontend"]
skips = ["B101"]
