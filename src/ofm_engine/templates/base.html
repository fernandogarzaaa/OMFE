<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="{% block robots %}index, follow{% endblock %}">
<title>{% block title %}{{ cfg.brand.name }}{% endblock %}</title>
<style>
:root{--brand:{{ cfg.brand.primary_color }};--bg:#0b0b10;--card:#15151d;--text:#f4f4f7;--muted:#a1a1b5;--err:#f87171}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
main{max-width:520px;margin:0 auto;padding:24px 18px 48px}
h1{font-size:1.75rem;line-height:1.2;margin:.5rem 0}p.sub{color:var(--muted);margin:0 0 1rem}
.card{background:var(--card);border-radius:16px;padding:18px;margin:16px 0}
label{display:block;font-size:.9rem;margin:12px 0 4px;color:var(--muted)}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a36;background:#0f0f15;color:var(--text);font-size:1rem}
.row{display:flex;gap:10px}.row>div{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:.85rem;color:var(--muted)}.check input{width:auto;margin-top:3px}
button,.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:1.05rem;text-align:center;text-decoration:none;cursor:pointer;margin-top:12px}
ul.benefits{padding-left:1.1rem;color:var(--muted)}.err{color:var(--err);font-size:.9rem;min-height:1.2em}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:12px auto}
footer{color:var(--muted);font-size:.75rem;text-align:center;margin-top:24px}
</style>
{% block head %}{% endblock %}
</head>
<body>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
